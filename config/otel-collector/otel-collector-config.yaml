receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"

  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

  # Standalone AMS monitor (see ../../../monitor) - runs on the host, not in Docker,
  # so it's reached via host.docker.internal. Duplicates the same log stream
  # Loki gets; the monitor itself decides what's worth keeping (WARN+).
  otlphttp/monitor:
    # otlphttp appends the signal-specific suffix itself, so this becomes
    # http://host.docker.internal:7787/v1/logs - matching monitor.py's route.
    endpoint: "http://host.docker.internal:7787"
    encoding: json
    compression: none
    headers:
      Authorization: "Bearer ${env:MONITOR_API_KEY}"

  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: :1888
  zpages:
    endpoint: :55679

service:
  extensions: [pprof, zpages, health_check]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug/metrics]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, otlphttp/monitor]

  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
